[project]
name = "tupai-zhice-backend"
version = "0.1.0"
description = "Backend for the TuPai ZhiCe scheduling MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "ortools>=9.12,<10",
  "pydantic-settings>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-openpyxl>=3.1.5.20260807",
]

[project.scripts]
tupai-api = "app.main:run"
tupai-seed = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
